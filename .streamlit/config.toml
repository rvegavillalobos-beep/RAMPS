# Visual theme — industrial, RAL-inspired: anthracite ink, gentian blue, signal green/red for state only.
# Extra styling (verdict panel, charts, metrics) lives in the VISUAL THEME block of app.py.

[theme]
base = "light"
primaryColor = "#13568F"
backgroundColor = "#F2F4F5"
secondaryBackgroundColor = "#E9EDEF"
textColor = "#1E2629"
linkColor = "#13568F"
borderColor = "#DCE1E4"
dataframeBorderColor = "#DCE1E4"
dataframeHeaderBackgroundColor = "#F2F4F5"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
baseFontSize = 15
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
# State colors: green = within μ, red = exceeds μ, amber = configuration warning
redColor = "#B3261E"
greenColor = "#237F52"
orangeColor = "#C46A00"
yellowColor = "#C98A00"
blueColor = "#13568F"
violetColor = "#6B5BD6"
grayColor = "#7C878D"
chartCategoricalColors = ["#13568F", "#6B5BD6", "#1E2629", "#9AA4AA"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F5"
